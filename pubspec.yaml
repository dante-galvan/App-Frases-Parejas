name: frases_amor_flutter
description: "Frases de Amor para Parejas — App premium para descubrir, guardar y compartir frases románticas dedicadas a parejas y enamorados."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.19.0
  cupertino_icons: ^1.0.8

  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  gal: ^2.3.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - Imagenes/
    - frases_amor_224.json
